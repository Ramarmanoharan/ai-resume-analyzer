<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="hero-bg py-5 min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="glass-card p-5">
                    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
                        <div>
                            
                            <h1 class="display-5 fw-bold">AI Resume Analyzer</h1>
                            <p class="text-secondary">
                                Upload a resume PDF and compare it with a job description
                                to get ATS score, missing skills, and interview questions.
                            </p>
                        </div>
                        <div>
                            <a th:href="@{/history}" class="btn btn-outline-primary rounded-pill px-4">
                                View History
                            </a>
                        </div>
                    </div>

                    <div th:if="${error}" class="alert alert-danger">
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/analyze}" method="post" enctype="multipart/form-data">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Upload Resume (PDF)</label>
                            <input type="file" name="resume" class="form-control" accept=".pdf" required>
                            <small class="text-muted">Only PDF files are supported.</small>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Job Description</label>
                            <textarea name="jobDescription" class="form-control" rows="10"
                                      placeholder="Paste Job Description Here..." required></textarea>
                        </div>

                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-primary btn-lg">Analyze Resume</button>
                            <button type="reset" class="btn btn-light btn-lg">Clear</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
